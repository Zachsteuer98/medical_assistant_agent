# Local full-stack run. Requires .env and a built index in ./data/chroma
# (build it with: cd backend && uv run python -m app.ingest --corpus merck).
services:
  backend:
    build: ./backend
    # Match the host user so Chroma can write its SQLite journal in the mounted volume.
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      CHROMA_DIR: /data/chroma
    volumes:
      - ./data/chroma:/data/chroma
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
