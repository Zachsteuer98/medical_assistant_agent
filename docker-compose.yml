# Local full-stack run. Requires .env and a built index on the host.
# Default is the public VA/DoD corpus (./data/chroma_public); build it with:
#   cd backend && uv run python -m app.download --corpus public && uv run python -m app.ingest --corpus public
# For Merck (local only), set CORPUS=merck and CHROMA_HOST_DIR=./data/chroma in .env.
services:
  backend:
    build: ./backend
    # Match the host user so Chroma can write its SQLite journal in the mounted volume.
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      CHROMA_DIR: /data/chroma
    volumes:
      - ${CHROMA_HOST_DIR:-./data/chroma_public}:/data/chroma
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
