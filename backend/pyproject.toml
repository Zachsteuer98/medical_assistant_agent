[project]
name = "medical-assistant-backend"
version = "0.1.0"
description = "RAG clinical decision-support API with page-level citations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.2",
    "chromadb==1.5.9",
    "openai==3.50.0",
    "pymupdf==2.1",
    "tiktoken==0.14.0",
    "numpy==2.5.4",
]

[dependency-groups]
eval = ["matplotlib==3.11.2"]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
